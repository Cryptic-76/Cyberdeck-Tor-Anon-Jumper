# ==============================================================================
# Cyberdeck Tor Suite - CodeQL Security Analysis Pipeline
# Automatisierte statische Code-Analyse (SAST) für Python unter Kali Linux
# ==============================================================================

name: "CodeQL Analysis (Python / Kali Linux)"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling:latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Prepare Kali Environment
      run: |
        apt-get update
        apt-get install -y git python3 python3-pip curl

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python
        queries: security-and-quality
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:python"
